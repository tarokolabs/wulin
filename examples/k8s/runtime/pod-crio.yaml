apiVersion: v1
kind: Pod
metadata:
  name: pod-crio
spec:
  # 平台提供的 RuntimeClass：crun（CRI-O 內建）；gvisor 只在以 --gvisor 建立的叢集存在（tk8s v2）
  runtimeClassName: crun
  containers:
  - name: mybase
    image: ghcr.io/tarokolabs/wulin/toolbox:v2026.8.0
    imagePullPolicy: IfNotPresent
    command: ["/bin/sleep", "infinity"]
