# tk8s v2：以 type: LoadBalancer 曝露（LB-IPAM 配 IP），主機與有路由的機器直接可達；舊的 tkport 註解已移除。
apiVersion: v1
kind: Service
metadata:
  name: dthba
  namespace: dt
spec:
  type: LoadBalancer
  selector:
    statefulset.kubernetes.io/pod-name: dtw-2
  ports:
   - name: hbase
     port: 16010
     protocol: TCP
     targetPort: 16010
