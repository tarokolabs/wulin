apiVersion: v1
kind: Service
metadata:
  name: mail-svc
spec:
  selector:
    app: mailserver
  ports:
    - name: smtp
      protocol: TCP
      port: 25
      targetPort: 25
    - name: imap
      protocol: TCP
      port: 143
      targetPort: 143
    - name: pop3
      protocol: TCP
      port: 110
      targetPort: 110
    - name: imaps
      protocol: TCP
      port: 993
      targetPort: 993
