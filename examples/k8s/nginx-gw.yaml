# tk8s v2：以 type: LoadBalancer 曝露（LB-IPAM 配 IP），主機與有路由的機器直接可達；舊的 tkport 註解已移除。
apiVersion: v1
kind: Service
metadata:
  name: svc-ng
spec:
  type: LoadBalancer
  selector:
    app: pod-ng
  ports:
    - protocol: TCP
      port: 5566
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: pod-ng
  name: pod-ng
spec:
  containers:
  - name: myng
    image: dkreg.taroko:5000/nginx
    imagePullPolicy: IfNotPresent
    ports:
     - containerPort: 80
