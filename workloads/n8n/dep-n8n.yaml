apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: dep-n8n
  name: dep-n8n
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      service: dep-n8n
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        service: dep-n8n
    spec:
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown 1000:1000 /data"]
          volumeMounts:
            - name: pvc-n8n
              mountPath: /data
      containers:
        - command:
            - /bin/sh
          args:
            - -c
            - sleep 5; n8n start
          env:
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: svc-postgres.psql
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: n8n
            - name: N8N_SECURE_COOKIE
              value: "false"
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_PASSWORD
            - name: N8N_PROTOCOL
              value: http
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PATH
              value: "/n8n/"
          image: dkreg.taroko:5000/alp.n8n
          name: n8n
          ports:
            - containerPort: 5678
              hostPort: 5678
          resources:
            requests:
              memory: "250Mi"
            limits:
              memory: "500Mi"
          volumeMounts:
            - mountPath: /home/node/.n8n
              name: pvc-n8n
      restartPolicy: Always
      volumes:
        - name: pvc-n8n
          persistentVolumeClaim:
            claimName: pvc-n8n
        - name: postgres-secret
          secret:
            secretName: postgres-secret
      nodeSelector:
        app: taroko
