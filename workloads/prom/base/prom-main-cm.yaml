apiVersion: v1
kind: ConfigMap
metadata:
  name: prom-main-conf
  labels:
    name: prom-main-conf
data:
  prometheus.yml: |-
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - "/etc/prometheus/rules/*.yaml"
    scrape_config_files:
      - "/etc/prometheus/scrapes/*.yaml"
    alerting:
      alertmanagers:
      - scheme: http
        static_configs:
        - targets:
          - "svc-alert.prom:9093"
