apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: psql
  namespace: cnpg
spec:
  instances: 4
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  bootstrap:
    initdb:
      database: cnpg
      owner: bigred
      secret:
        name: cnpg-bigred
  storage:
    storageClass: local-path
    size: 1Gi
