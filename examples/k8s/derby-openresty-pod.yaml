apiVersion: v1
kind: Pod
metadata:
  name: derby-openresty-app
  labels:
    app: restful-derby
spec:
  shareProcessNamespace: true  
  containers:
    # 1. 核心網站應用系統 Container
    - name: springboot-derby
      image: quay.io/cloudwalker/alpine.derby
      ports:
        - containerPort: 8888

    # 2. 高效能 OpenResty 代理與快取 Container (Sidecar)
    - name: openresty-gateway
      image: openresty/openresty:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        # 將設定檔正確掛載至 Nginx 配置目錄
        - name: config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf

  # 定義掛載來源
  volumes:
    - name: config-volume
      configMap:
        name: openresty-config
