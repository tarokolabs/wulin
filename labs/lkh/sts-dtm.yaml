apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dtm
  namespace: lkh
spec:
  selector:
    matchLabels:
      sts: dtm
  serviceName: "svc-lkh"
  volumeClaimTemplates:
  - metadata:
      name: nn
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: local-path
      resources:
        requests:
          storage: 60Gi
  - metadata:
      name: sn
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: local-path
      resources:
        requests:
          storage: 60Gi
  - metadata:
      name: zk
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: local-path
      resources:
        requests:
          storage: 30Gi
  replicas: 2
  template:
    metadata:
      labels:
       sts: dtm
       app: lkh
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 10.98.64.10
        searches:
        - svc-lkh.lkh.svc.tklkh.k8s
        - lkh.svc.tklkh.k8s
        - svc.tklkh.k8s
      volumes:
        - name: lkh-sys
          hostPath:
            path: /opt/taroko/sys
      runtimeClassName: crun
      containers:
        - image: dkreg.taroko:5000/uslkh
          imagePullPolicy: IfNotPresent
          name: dtm
          tty: true
          volumeMounts:
           - name: lkh-sys
             mountPath: /opt/taroko/sys
           - name: nn
             mountPath: /home/bigred/nn
           - name: sn
             mountPath: /home/bigred/sn
           - name: zk
             mountPath: /home/bigred/zk
