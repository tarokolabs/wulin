apiVersion: v1
kind: ConfigMap
metadata:
  name: mail-config
data:
  # Use this to specify the domains to be served
  mail_domains: "tkdp.k8s"
  # Other custom configurations can go here
  postfix-main.cf: |
    mydomain = tkdp.k8s
    myhostname = mx1.tkdp.k8s
    mynetworks = 127.0.0.0/8 192.168.188.0/24 172.22.0.0/16
    mydestination = mx1.tkdp.k8s, tkdp.k8s, mx1.k8s, k8s
    # smtpd_relay_restrictions = permit_mynetworks
