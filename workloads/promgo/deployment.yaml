apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-promgo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promgo
  template:
    metadata:
      labels:
        app: promgo
    spec:
      containers:
        - name: promgo
          image: dkreg.taroko:5000/promgo
          ports:
            - containerPort: 8888
          resources:
            limits:
              memory: 200Mi
              cpu: 300m
            requests:
              memory: 100Mi
              cpu: 100m
