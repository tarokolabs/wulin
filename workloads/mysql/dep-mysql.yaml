apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-mysql
  labels:
    app: dep-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dep-mysql
  template:
    metadata:
      labels:
        app: dep-mysql
    spec:
      containers:
      - image: dkreg.kube-system:5000/oracle.mysql:24.01
        imagePullPolicy: IfNotPresent
        name: fbs
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: pvc-mysql
