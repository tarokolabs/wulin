apiVersion: v1
kind: Pod
metadata:
  name: pod-usdt-hdp350
spec:
  dnsPolicy: ClusterFirst
  runtimeClassName: crun
  nodeName: tkdt-worker1
  containers:
  - image: dkreg.taroko:5000/usdt.hdp350
    name: hdp350
    tty: true
    securityContext:
      privileged: true
    volumeMounts:
      - mountPath: "/opt/zfs/sys"
        name: usdt-hdp350-storage
  volumes:
    - name: usdt-hdp350-storage
      hostPath:
        path: /opt/zfs/sys
