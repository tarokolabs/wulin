apiVersion: v1
kind: Pod
metadata:
  name: pod-crio
spec:
  # 平台預設提供的 RuntimeClass（tk8s manifests/runtimeclass.yaml：crun、gvisor，CRI-O 與 containerd 皆有）
  runtimeClassName: crun
  containers:
  - name: mybase
    image: ghcr.io/tarokolabs/wulin/toolbox:v2026.8.0
    imagePullPolicy: IfNotPresent
    command: ["/bin/sleep", "infinity"]
