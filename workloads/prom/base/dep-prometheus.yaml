apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-prometheus
  labels:
    app: prometheus-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-server
  template:
    metadata:
      labels:
        app: prometheus-server
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus/"
            - "--web.enable-lifecycle"
            - "--storage.tsdb.retention.time=5d"
            - "--storage.tsdb.retention.size=10GB"
          ports:
            - containerPort: 9090
              hostPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml # 主檔極少變動，用 subPath 無妨
            - name: rules-volume
              mountPath: /etc/prometheus/rules
            - name: scrapes-volume
              mountPath: /etc/prometheus/scrapes
            - name: prometheus-storage-volume
              mountPath: /prometheus/
          env:
          - name: HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
      volumes:
        - name: config-volume
          configMap:
            name: prom-main-conf
        - name: rules-volume
          configMap:
            name: prom-rules-conf
        - name: scrapes-volume
          configMap:
            name: prom-scrapes-conf
        - name: prometheus-storage-volume
          hostPath:
            path: /opt/zfs/prometheus
