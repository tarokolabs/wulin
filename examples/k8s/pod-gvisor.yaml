# gVisor 沙箱容器示範。
# tk8s v2：RuntimeClass gvisor 只在以 `--gvisor` 建立的叢集存在——`tkctl create cluster <名> --gvisor`。
# `--gvisor` 會自動選 veth datapath；預設的 netkit 下 gVisor 沙箱起得來但完全沒有網路（tk8s#56 實測）。
# 驗證方式：pod 內 `uname -r` 應顯示 gVisor 核心（例如 4.19.0-gvisor）而非主機核心。
apiVersion: v1
kind: Pod
metadata:
  name: pod-gvisor
spec:
  runtimeClassName: gvisor
  containers:
  - name: base
    image: ghcr.io/tarokolabs/wulin/toolbox:v2026.8.0
    securityContext:
      privileged: true
