apiVersion: v1
kind: Namespace
metadata:
  name: j
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-j
  namespace: j
  labels:
    dt: hdp
spec:
  containers:
  - name: j100
    image: quay.io/cloudwalker/nginx
---
apiVersion: v1
kind: Service
metadata:
  name: svc-j
  namespace: j
spec:
  selector:
    dt: hdp
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
