apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: rbean
spec:
  hard:
    requests.cpu: "0.5"
    requests.memory: 256Mi
    limits.cpu: "2"
    limits.memory: 2Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: object-quota
  namespace: rbean
spec:
  hard:
    pods: "10"
    configmaps: "5"
    persistentvolumeclaims: "5"
    replicationcontrollers: "5"
    secrets: "5"
    services: "5"
