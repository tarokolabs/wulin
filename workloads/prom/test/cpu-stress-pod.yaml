apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress-test
  namespace: default
spec:
  containers:
  - name: stress-app-container
    image: alpine:latest
    # 透過無窮迴圈產生高 CPU 負載
    command: ["/bin/sh", "-c", "while true; do yes > /dev/null; done"]
    resources:
      requests:
        cpu: "200m"
      limits:
        cpu: "500m"
